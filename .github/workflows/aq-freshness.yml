name: Air quality freshness

# The hourly job can fail quietly — a revoked key, a changed endpoint. The page
# would keep rendering plausible but frozen numbers. This notices instead, and
# opens an issue so it cannot pass unseen.
#
# This comment used to claim the job also counts as repository activity, and so
# keeps GitHub from disabling the scheduled workflows after 60 days of quiet.
# It does not. The job holds contents: read and never pushes anything; all it
# produces is issues, and GitHub's documentation says only that schedules are
# disabled "when no repository activity has occurred in 60 days" without ever
# saying that an issue is repository activity. What actually keeps this
# repository awake is the hourly job's own commits, which stop precisely when
# something is wrong — so the claim was not merely unproven, it was backwards.
#
# Rather than argue about what counts, aq-watchdog.yml asks GitHub whether the
# hourly workflow is still active, and says so if it is not.

on:
  schedule:
    # Every six hours rather than daily. This is now the only thing that decides
    # whether a run of missed hours matters, so a whole day is too long to wait
    # to be told.
    - cron: '40 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check how stale the feed is
        id: check
        run: |
          set +e
          # stderr too: a crash writes nothing to stdout, and an issue
          # whose body reads FRESH is worse than no issue at all
          # Eight hours, not six. The hourly schedule is meant to publish every
          # hour and GitHub actually runs it every three to ten, so six hours is
          # inside the ordinary spread and opens issues about nothing.
          out=$(python scripts/check-aq-freshness.py --max-age-hours 8 2>&1)
          code=$?
          delim="status-$RANDOM-$RANDOM"          # a status line reading EOF would close it early
          echo "status<<$delim" >> "$GITHUB_OUTPUT"
          echo "$out" >> "$GITHUB_OUTPUT"
          echo "$delim" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "$out"
          exit 0

      - name: Open or update an issue when stale
        if: steps.check.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.check.outputs.status }}
        run: |
          set -euo pipefail
          title="Air quality data is stale"
          existing=$(gh issue list --state open --limit 200 --json number,title \
                       --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          body=$(printf '%s\n\n%s\n%s\n%s\n\n%s\n' \
            "One of the air quality checks came back unhappy." \
            '```' "$STATUS" '```' \
            "Checked by .github/workflows/aq-freshness.yml. This says the data is old; it does not say why, because age alone cannot tell. If \"Air quality hourly has stopped running\" is open as well, that is the reason, and this will clear when it does. If it is not, the runs are happening and coming back with nothing: usually a missing or revoked DATA_GOV_IN_KEY, or a change at data.gov.in. A stale record or strip points at \"Air quality daily rebuild\" instead, where the feed is fine but nothing is folding it into the published data.")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label "data" || \
              gh issue create --title "$title" --body "$body"
          fi

      - name: Close the issue once the feed recovers
        if: steps.check.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.check.outputs.status }}
        run: |
          set -euo pipefail
          title="Air quality data is stale"
          existing=$(gh issue list --state open --limit 200 --json number,title \
                       --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$existing" ]; then
            comment=$(printf '%s\n\n%s\n%s\n%s\n' \
              "All three checks are happy again." \
              '```' "$STATUS" '```')
            gh issue close "$existing" --comment "$comment"
          fi
