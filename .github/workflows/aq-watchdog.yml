name: Air quality watchdog

# Everything else here asks how old the published data is. That question cannot
# tell a dead source from a dead schedule — both age the files at the same rate
# — and it is worst exactly where it matters most: GitHub disables scheduled
# workflows in repositories that have gone quiet, and when it does, the only
# symptom is data getting older. The stale-data issue then blames the feed for
# a run that never happened, and the threshold gets tightened again.
#
# So this asks a different question: is each scheduled air quality workflow
# actually being run. scripts/check-aq-runs.py puts it to the Actions API, which
# answers with the workflow's state and with its list of scheduled runs. The
# state field settles the disabled case outright — GitHub says so in a field,
# with no threshold to tune and nothing to infer.
#
# Two schedules feed the published data and can each die this way: the hourly
# job that captures the readings, and the daily rebuild that folds them into the
# files the page reads. A matrix leg watches each, with its own quiet window,
# and each keeps its own issue.
#
# Those issues, and the stale-data one from aq-freshness.yml, read together as a
# diagnosis:
#
#   a watchdog issue alone   that schedule stopped, before the data aged out
#   the stale one alone      the schedules run, so the fetch or data.gov.in
#   both                     that schedule stopped, and the data aged behind it

on:
  schedule:
    # Hourly, for a job that is a couple of API calls. GitHub honours only a
    # fraction of any cron it is handed — aq-hourly.yml asks every hour and gets
    # roughly every three — so asking often is the only way to get a useful
    # worst case out of a scheduler that drops most of what it is told.
    - cron: '35 * * * *'
  # And again as soon as either watched workflow finishes, which catches a run
  # that breaks without waiting on a cron GitHub may well drop.
  workflow_run:
    workflows: ["Air quality hourly", "Air quality daily rebuild"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read            # the workflow's state, and its runs
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    strategy:
      # One leg going red because its API read failed must not cancel the other
      # leg's perfectly good check.
      fail-fast: false
      matrix:
        include:
          # Hourly, honoured perhaps a third of the time: scheduled starts have
          # run 2.1 to 5.5h apart, so 24h is over four times the widest seen.
          - workflow: aq-hourly.yml
            label: hourly
            quiet_hours: 24
          # Once a day, and so far honoured on both days it has had — the two
          # scheduled starts seen are 23.9h apart. GitHub drops a fraction of
          # every cron, and a daily one gets a single chance a day to be
          # dropped, so a skipped day or two is ordinary. 96h is four times that
          # one measured gap and rides over two missed days; it is loose on
          # purpose, because DISABLED is caught by the state field the moment
          # GitHub turns the schedule off, not by this window. Worth retuning
          # once a wider run history has built up.
          - workflow: aq-daily-rebuild.yml
            label: daily rebuild
            quiet_hours: 96
    concurrency:
      # The schedule and the two workflow_run triggers can land together. Keyed
      # by workflow so the two legs never block each other, only their own
      # doubles: without it both copies of a leg could see no open issue and
      # both open one.
      group: aq-watchdog-${{ matrix.workflow }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ask whether the workflow is being run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ matrix.workflow }}
          QUIET_HOURS: ${{ matrix.quiet_hours }}
        run: |
          set +e
          # stderr as well: a crash that only wrote to stderr would leave an
          # issue whose body says nothing at all.
          out=$(python scripts/check-aq-runs.py --workflow "$WORKFLOW" --quiet-hours "$QUIET_HOURS" 2>&1)
          code=$?
          delim="status-$RANDOM-$RANDOM"   # a status line reading EOF would close it early
          echo "status<<$delim" >> "$GITHUB_OUTPUT"
          echo "$out" >> "$GITHUB_OUTPUT"
          echo "$delim" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "$out"
          exit 0

      - name: Open or update an issue when the runs have stopped
        if: steps.check.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.check.outputs.status }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          title="Air quality $LABEL has stopped running"
          body=$(printf '%s\n\n%s\n%s\n%s\n\n%s\n' \
            "GitHub is not running the air quality $LABEL workflow, or is running it and the job is not finishing." \
            '```' "$STATUS" '```' \
            "Checked by .github/workflows/aq-watchdog.yml, which asks the Actions API rather than reading the data. DISABLED means the workflow needs switching back on in the Actions tab; nothing will run until somebody does. SILENT means GitHub still calls it active but has not dispatched it for longer than the schedule has ever gone quiet before. FAILING means it is being dispatched and the job itself is breaking, and the linked run holds the log. If \"Air quality data is stale\" is open too, it is this problem's shadow rather than a second one, and it should clear once this does.")
          existing=$(gh issue list --state open --search "$title in:title" \
                       --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "$body" --label "data" || \
              gh issue create --title "$title" --body "$body"
            exit 0
          fi
          # Say it again, but not every hour. This can run several times an hour
          # — on its own cron and on every workflow_run — and an outage nobody
          # has got to yet does not need another twenty copies of the same
          # paragraph. Six hours is about noise, not about noticing: the
          # noticing already happened.
          last=$(gh issue view "$existing" --json createdAt,comments \
                   --jq '(.comments[-1].createdAt) // .createdAt')
          # A timestamp that is missing, will not parse, or is somehow in the
          # future falls through and comments. Erring towards saying it twice
          # beats a date bug that silences an outage — and date reads an empty
          # string as the present moment, which would do exactly that.
          said=0
          if [ -n "$last" ]; then
            said=$(date -u -d "$last" +%s 2>/dev/null || echo 0)
          fi
          since=$(( $(date -u +%s) - said ))
          if [ "$said" -gt 0 ] && [ "$since" -ge 0 ] && [ "$since" -lt 21600 ]; then
            echo "issue #$existing already says so, $((since / 60))m ago; not repeating"
            exit 0
          fi
          gh issue comment "$existing" --body "$body"

      - name: Close the issue once the runs come back
        if: steps.check.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.check.outputs.status }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          title="Air quality $LABEL has stopped running"
          existing=$(gh issue list --state open --search "$title in:title" \
                       --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            comment=$(printf '%s\n\n%s\n%s\n%s\n' \
              "The air quality $LABEL workflow is being run again." \
              '```' "$STATUS" '```')
            gh issue close "$existing" --comment "$comment"
          fi

      - name: Go red when the API could not be read
        if: steps.check.outputs.code != '0' && steps.check.outputs.code != '1'
        env:
          # Through the environment, not interpolated into the script. The
          # status carries strings GitHub gave us, and a workflow name with a
          # backtick in it would otherwise be run rather than printed.
          STATUS: ${{ steps.check.outputs.status }}
          LABEL: ${{ matrix.label }}
        run: |
          # This is the watcher failing, not the thing it watches, and an issue
          # saying so would be crying wolf — the pipeline may be perfectly
          # well. A red run is its own notification and leaves nothing to tidy
          # up afterwards. The check retries a failing API three times before
          # it gives up, so this is not a single blip.
          echo "::error::could not ask GitHub whether the air quality $LABEL workflow ran"
          echo "$STATUS"
          exit 1
