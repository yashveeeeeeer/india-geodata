name: Test air quality source

on:
  pull_request:
    paths:
      - 'scripts/fetch-aq-latest.py'
      - 'scripts/aqi_scale.py'
      - 'tests/test_aq_source.py'
      - '.github/workflows/test-aq-source.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-aq-latest.py'
      - 'scripts/aqi_scale.py'
      - 'tests/test_aq_source.py'
      - '.github/workflows/test-aq-source.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py'
